<main class="mx-auto w-full max-w-3xl px-4 py-10">
  <h1 class="text-xl font-semibold text-gray-900">Account</h1>
  <p class="muted mt-2">A guarded route: signed-out visitors never reach it — the guard sends them to /login and back here after signing in.</p>

  <div class="card mt-6 p-4">
    <p class="eyebrow">Name</p>
    <p class="mt-1 text-sm text-gray-900" x-text="$store.session.user?.name"></p>

    <p class="eyebrow mt-4">Email</p>
    <p class="mt-1 text-sm text-gray-900" x-text="$store.session.user?.email"></p>
  </div>

  <button type="button" class="btn btn-ghost mt-6" @click="signOut()">Sign out</button>
</main>
