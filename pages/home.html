<main class="mx-auto w-full max-w-4xl px-4 py-10" x-data="homePage">

  <div class="flex items-start gap-4">
    <img src="/favicon.svg" alt="" width="48" height="48" class="rounded-xl">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">AlpineShell</h1>
      <p class="muted mt-1">Structure for Alpine.js apps — routing, pages, partials and stores, with nothing to compile.</p>
    </div>
  </div>

  <div class="mt-8 grid gap-4 sm:grid-cols-3">
    <template x-for="step in steps" :key="step.title">
      <div class="card border-t-2 border-t-amber-400 p-4">
        <p class="eyebrow text-amber-600" x-text="step.where"></p>
        <p class="mt-1 text-sm font-medium text-gray-900" x-text="step.title"></p>
        <p class="muted mt-2 text-xs leading-relaxed" x-text="step.detail"></p>
      </div>
    </template>
  </div>

  <div class="card mt-4 flex flex-wrap items-center gap-x-8 gap-y-3 p-4">
    <div>
      <p class="eyebrow">Session</p>
      <p class="mt-1 text-sm text-gray-900" x-text="$store.session.user?.name ?? 'Signed out'"></p>
    </div>

    <div>
      <p class="eyebrow">This page rendered</p>
      <p class="mt-1 text-sm text-gray-900" x-text="formatDate(loadedAt, { timeStyle: 'medium' })"></p>
    </div>

    <button type="button" class="btn btn-ghost btn-sm ml-auto" @click="errMsg = 'Something went wrong. This is the toast.'">
      Trigger an error
    </button>
    <a href="/nowhere" class="btn btn-ghost btn-sm">Try a dead link</a>
    <a href="/account" class="btn btn-primary btn-sm">Try a guarded route</a>
  </div>

  <p class="muted mt-8 text-xs">
    Start by editing <span class="font-mono text-gray-700">pages/home.html</span>.
  </p>

</main>
