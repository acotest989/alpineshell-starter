<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlpineShell</title>
  <meta name="description" content="Starter for AlpineShell — structure and conventions for Alpine.js apps, without a build step.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/main.css">
  <link rel="preload" href="/assets/theme.css" as="fetch" crossorigin>
  <!-- The framework, pinned in one place. Point it at a local copy to work on it. -->
  <script type="importmap">
  {
    "imports": {
      "alpineshell": "https://cdn.jsdelivr.net/gh/acotest989/alpineshell@v0.3.0/index.js"
    }
  }
  </script>

  <script type="module" src="/main.js" defer></script>
</head>
<body class="bg-gray-50">
  <div id="app" x-data="app" x-cloak>

    <div x-html="partials.toast"></div>

    <div id="page" class="flex flex-col min-h-screen"></div>

  </div>
</body>
</html>
