<header class="sticky top-0 z-20 border-b border-gray-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-3xl items-center gap-6 px-4 py-3">

    <a href="/" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-gray-900">
      <img src="/favicon.svg" alt="" width="22" height="22" class="rounded-md">
      App
    </a>

    <nav class="flex items-center gap-4 text-sm">
      <a
        href="/"
        class="border-b-2 py-0.5 transition-colors hover:text-gray-900"
        :class="$router.context.path === '/'
          ? 'border-amber-400 font-medium text-gray-900'
          : 'border-transparent text-gray-500'"
      >Home</a>
    </nav>

    <div class="ml-auto flex items-center gap-3">
      <template x-if="$store.session.user">
        <div class="flex items-center gap-3">
          <a
            href="/account"
            class="muted hidden border-b-2 py-0.5 transition-colors hover:text-gray-900 sm:inline"
            :class="$router.context.path === '/account'
              ? 'border-amber-400 font-medium text-gray-900'
              : 'border-transparent'"
            x-text="$store.session.user.name"
          ></a>
          <button type="button" class="btn btn-ghost btn-sm" @click="signOut()">Sign out</button>
        </div>
      </template>

      <template x-if="!$store.session.user">
        <a href="/login" class="btn btn-primary btn-sm">Sign in</a>
      </template>
    </div>

  </div>
</header>
